<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 祝福时光机 · 温暖共创 ✨</title>
    <style>
        /* ========== 全局重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        body {
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(135deg, #f5f0ff, #e6f0fa);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* 主卡片 */
        .main-card {
            background: white;
            border-radius: 40px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        h1 {
            text-align: center;
            color: #7c5c9c;
            font-size: 3em;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #a58bb4;
            margin-bottom: 30px;
            font-size: 1.2em;
        }

        /* 祝福展示区 */
        .blessing-box {
            background: #f8f4ff;
            border-radius: 30px;
            padding: 50px;
            margin: 20px 0;
            border: 3px solid white;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
        }

        #greetingDisplay {
            font-size: 2em;
            color: #4a3b5c;
            text-align: center;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 按钮 */
        .button-wrapper {
            text-align: center;
            margin: 20px 0;
        }

        .btn {
            background: #9b7ebb;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.3em;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #6b4f8a;
            transition: 0.1s;
        }

        .btn:hover {
            background: #ae8fd0;
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #6b4f8a;
        }

        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #6b4f8a;
        }

        /* 评论区 */
        .comments-section {
            background: white;
            border-radius: 40px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .section-title {
            font-size: 2em;
            color: #7c5c9c;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #f0e6ff;
        }

        /* 输入区域 */
        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        #commentInput {
            flex: 1;
            padding: 15px 20px;
            border: 3px solid #f0e6ff;
            border-radius: 30px;
            font-size: 1.1em;
            outline: none;
        }

        #commentInput:focus {
            border-color: #9b7ebb;
        }

        .send-btn {
            background: #9b7ebb;
            color: white;
            border: none;
            padding: 0 30px;
            border-radius: 30px;
            font-size: 1.2em;
            cursor: pointer;
        }

        .send-btn:hover {
            background: #ae8fd0;
        }

        /* 评论列表 */
        .comments-list {
            max-height: 500px;
            overflow-y: auto;
            padding: 10px;
        }

        /* 单条评论 */
        .comment-item {
            background: #f8f4ff;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 5px solid #9b7ebb;
        }

        .comment-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: #d4c1e0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
        }

        .author {
            font-weight: bold;
            color: #7c5c9c;
        }

        .time {
            color: #b4a3c4;
            font-size: 0.9em;
            margin-left: auto;
        }

        .content {
            font-size: 1.2em;
            color: #333;
            padding-left: 50px;
            word-break: break-word;
        }

        .delete-btn {
            margin-left: 50px;
            margin-top: 10px;
            background: none;
            border: none;
            color: #ff9999;
            cursor: pointer;
            font-size: 0.9em;
        }

        .delete-btn:hover {
            color: #ff6666;
        }

        .empty-msg {
            text-align: center;
            color: #b4a3c4;
            padding: 50px;
            font-size: 1.2em;
        }

        .stats {
            text-align: center;
            margin: 15px 0;
            color: #a58bb4;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 主卡片 -->
        <div class="main-card">
            <h1>✨ 祝福时光机</h1>
            <div class="subtitle">每天一句温暖话</div>
            
            <!-- 祝福展示区 -->
            <div class="blessing-box">
                <div id="greetingDisplay">🌈 点击下方按钮抽取祝福</div>
            </div>
            
            <!-- 按钮和统计 -->
            <div class="button-wrapper">
                <button class="btn" onclick="showRandomGreeting()">🎁 抽取祝福</button>
            </div>
            <div class="stats">
                📚 祝福库: <span id="totalCount">0</span> 条 · 
                💬 留言: <span id="commentCount">0</span> 条
            </div>
        </div>

        <!-- 评论区 -->
        <div class="comments-section">
            <div class="section-title">💭 温暖留言板</div>
            
            <!-- 输入框 -->
            <div class="input-area">
                <input type="text" id="commentInput" placeholder="写下你的祝福...">
                <button class="send-btn" onclick="addComment()">发表</button>
            </div>
            
            <!-- 评论列表 -->
            <div class="comments-list" id="commentsList">
                <div class="empty-msg">✨ 还没有留言，来做第一个送祝福的人吧～</div>
            </div>
        </div>
    </div>

    <script>
        // ========== 祝福语库 ==========
        const greetings = [
            "愿你每一天都充满阳光和欢笑。",
            "祝你身体健康，万事如意。",
            "愿幸运和幸福时刻伴随你。",
            "新的一天，新的希望，加油！",
            "希望你有个超级棒的好心情！",
            "愿所有美好，如期而至。",
            "今天也是被好运包围的一天！",
            "你比想象中更强大，更勇敢。",
            "生活明朗，万物可爱。",
            "记得要开心，记得要微笑。",
            "愿你眼中有光，心中有爱。",
            "做自己的太阳，无需凭借谁的光。",
            "慢慢来，会好的。",
            "今天会有好事发生。",
            "你是最棒的！"
        ];

        // ========== 评论数组 ==========
        let comments = [];

        // ========== 页面初始化 ==========
        window.onload = function() {
            // 显示祝福库数量
            document.getElementById('totalCount').innerHTML = greetings.length;
            
            // 从本地存储加载评论
            loadComments();
            
            // 显示一条随机祝福
            showRandomGreeting();
        };

        // ========== 随机显示祝福 ==========
        function showRandomGreeting() {
            let randomIndex = Math.floor(Math.random() * greetings.length);
            let greeting = greetings[randomIndex];
            document.getElementById('greetingDisplay').innerHTML = greeting;
        }

        // ========== 添加评论 ==========
        function addComment() {
            let input = document.getElementById('commentInput');
            let content = input.value.trim();
            
            // 检查是否为空
            if (content === '') {
                alert('请输入祝福内容！');
                return;
            }

            // 获取当前时间
            let now = new Date();
            let timeStr = now.getMonth() + 1 + '-' + now.getDate() + ' ' + 
                         now.getHours() + ':' + (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();

            // 创建评论对象
            let newComment = {
                id: Date.now(),  // 唯一ID
                author: '匿名祝福者',
                content: content,
                time: timeStr
            };

            // 添加到数组（插到最前面）
            comments.unshift(newComment);

            // 清空输入框
            input.value = '';

            // 重新显示评论列表
            displayComments();

            // 保存到本地存储
            saveComments();

            // 更新计数
            updateCommentCount();
        }

        // ========== 显示所有评论 ==========
        function displayComments() {
            let listDiv = document.getElementById('commentsList');
            
            // 如果没有评论，显示空状态
            if (comments.length === 0) {
                listDiv.innerHTML = '<div class="empty-msg">✨ 还没有留言，来做第一个送祝福的人吧～</div>';
                return;
            }

            // 生成所有评论的HTML
            let html = '';
            for (let i = 0; i < comments.length; i++) {
                let c = comments[i];
                html += `
                    <div class="comment-item" id="comment-${c.id}">
                        <div class="comment-header">
                            <div class="avatar">✨</div>
                            <span class="author">${c.author}</span>
                            <span class="time">${c.time}</span>
                        </div>
                        <div class="content">${c.content}</div>
                        <button class="delete-btn" onclick="deleteComment(${c.id})">🗑️ 删除</button>
                    </div>
                `;
            }
            
            listDiv.innerHTML = html;
        }

        // ========== 删除评论 ==========
        function deleteComment(id) {
            if (confirm('确定删除这条留言吗？')) {
                // 过滤掉要删除的评论
                comments = comments.filter(function(c) {
                    return c.id !== id;
                });
                
                // 重新显示
                displayComments();
                
                // 保存到本地存储
                saveComments();
                
                // 更新计数
                updateCommentCount();
            }
        }

        // ========== 更新评论数量 ==========
        function updateCommentCount() {
            document.getElementById('commentCount').innerHTML = comments.length;
        }

        // ========== 保存到本地存储 ==========
        function saveComments() {
            localStorage.setItem('myComments', JSON.stringify(comments));
        }

        // ========== 从本地存储加载 ==========
        function loadComments() {
            let saved = localStorage.getItem('myComments');
            if (saved) {
                comments = JSON.parse(saved);
                displayComments();
                updateCommentCount();
            }
        }
    </script>
</body>
</html>
