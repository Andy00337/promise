<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 祝福时光机 · 温暖共创 ✨</title>
    <style>
        /* ========== 全局重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        /* ========== 动态渐变背景 ========== */
        body {
            min-height: 100vh;
            padding: 30px 20px;
            background: linear-gradient(-45deg, #f9e6f0, #e6d5f0, #d5e8f0, #f0e2e8);
            background-size: 400% 400%;
            animation: gradientBG 18s ease infinite;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 漂浮光点 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.4) 0%, transparent 25%),
                        radial-gradient(circle at 80% 70%, rgba(255,255,240,0.4) 0%, transparent 30%),
                        pointer-events none;
        }

        /* ========== 主容器 ========== */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ========== 主卡片 ========== */
        .main-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 60px 60px 40px 40px;
            padding: 50px 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.1),
                        0 0 0 1px rgba(255,255,255,0.8) inset,
                        0 10px 30px rgba(180,140,200,0.2);
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.9);
        }

        /* 顶部装饰 */
        .card-top-decoration {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: -70px;
            margin-bottom: 20px;
        }

        .decoration-circle {
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.7);
            border-radius: 50%;
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8em;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 2px solid white;
        }

        /* ========== 标题区域 ========== */
        .title-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .glowing-title {
            font-size: 3.2em;
            font-weight: 800;
            background: linear-gradient(135deg, #b27a9f, #8f71a3, #6d8aa5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 5px 15px rgba(255,255,255,0.5);
            letter-spacing: 2px;
            position: relative;
            display: inline-block;
        }

        .glowing-title::before,
        .glowing-title::after {
            content: '✧';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.6em;
            color: #d9b8d4;
        }

        .glowing-title::before { left: -50px; }
        .glowing-title::after { right: -50px; }

        .title-tagline {
            font-size: 1.2em;
            color: #a58bb4;
            background: rgba(255,255,255,0.4);
            padding: 8px 25px;
            border-radius: 50px;
            display: inline-block;
            margin-top: 10px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.6);
        }

        /* ========== 祝福展示区 ========== */
        .blessing-showcase {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 50px;
            padding: 40px;
            margin: 20px 0 30px;
            border: 3px solid rgba(255,255,255,0.8);
            box-shadow: 0 10px 30px rgba(170, 130, 200, 0.15);
            position: relative;
        }

        .quote-icon {
            position: absolute;
            font-size: 6em;
            color: rgba(255,255,255,0.5);
            font-family: serif;
            user-select: none;
        }

        .quote-icon.left {
            top: 10px;
            left: 20px;
            transform: rotate(180deg);
        }

        .quote-icon.right {
            bottom: 10px;
            right: 20px;
        }

        #greetingDisplay {
            font-size: 2.3em;
            line-height: 1.5;
            color: #4d3a5c;
            text-align: center;
            font-weight: 500;
            text-shadow: 0 2px 5px rgba(255,255,255,0.3);
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            transition: all 0.4s ease;
        }

        /* ========== 按钮区域 ========== */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 30px 0 20px;
        }

        .primary-btn {
            background: linear-gradient(145deg, #dcc4f0, #c4a5e0);
            border: none;
            padding: 18px 45px;
            border-radius: 60px;
            font-size: 1.4em;
            font-weight: 600;
            color: #5d4a70;
            cursor: pointer;
            box-shadow: 0 8px 0 #a587bb, 0 15px 25px rgba(165, 130, 200, 0.3);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 2px solid white;
        }

        .primary-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 11px 0 #a587bb, 0 20px 30px rgba(165, 130, 200, 0.4);
        }

        .primary-btn:active {
            transform: translateY(8px);
            box-shadow: 0 3px 0 #a587bb, 0 10px 20px rgba(165, 130, 200, 0.3);
        }

        .stats-badge {
            background: rgba(255,255,255,0.4);
            backdrop-filter: blur(5px);
            padding: 12px 25px;
            border-radius: 50px;
            display: inline-flex;
            gap: 20px;
            border: 1px solid white;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #6b5b7a;
        }

        .stat-number {
            background: white;
            padding: 3px 12px;
            border-radius: 30px;
            font-weight: bold;
            color: #b27a9f;
        }

        /* ========== 评论区 ========== */
        .comments-section {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 35px 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border: 2px solid rgba(255,255,255,0.8);
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px dashed rgba(255,255,255,0.8);
        }

        .section-header h2 {
            font-size: 2em;
            color: #7a6590;
            font-weight: 600;
        }

        .comment-count {
            background: #e6d0f0;
            padding: 5px 15px;
            border-radius: 40px;
            color: #5d4a70;
            font-weight: bold;
        }

        /* 评论输入区 */
        .comment-input-area {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .comment-input-wrapper {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .comment-input {
            width: 100%;
            padding: 18px 25px;
            border: 3px solid rgba(255,255,255,0.9);
            border-radius: 50px;
            font-size: 1.1em;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(5px);
            transition: all 0.3s;
            outline: none;
            color: #4d3a5c;
        }

        .comment-input:focus {
            border-color: #c4a5e0;
            background: rgba(255,255,255,0.9);
            box-shadow: 0 0 0 5px rgba(196, 165, 224, 0.2);
        }

        .comment-input::placeholder {
            color: #a592b3;
            font-style: italic;
        }

        .send-btn {
            background: linear-gradient(145deg, #c4a5e0, #b18acf);
            border: none;
            padding: 0 35px;
            border-radius: 50px;
            font-size: 1.2em;
            font-weight: 600;
            color: white;
            cursor: pointer;
            box-shadow: 0 5px 0 #8b6fa3;
            transition: all 0.2s;
            border: 2px solid white;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #8b6fa3;
        }

        .send-btn:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #8b6fa3;
        }

        /* 评论列表 */
        .comments-list {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 10px;
        }

        /* 自定义滚动条 */
        .comments-list::-webkit-scrollbar {
            width: 8px;
        }

        .comments-list::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
        }

        .comments-list::-webkit-scrollbar-thumb {
            background: #c4a5e0;
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.5);
        }

        /* 单个评论卡片 */
        .comment-card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(5px);
            border-radius: 30px;
            padding: 20px 25px;
            margin-bottom: 15px;
            border: 2px solid rgba(255,255,255,0.8);
            animation: slideIn 0.4s ease;
            transition: all 0.2s;
        }

        .comment-card:hover {
            background: rgba(255, 255, 255, 0.8);
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(180,140,200,0.2);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .comment-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .comment-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(145deg, #e2caf0, #c8ace0);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            color: #5d4a70;
            border: 2px solid white;
        }

        .comment-author {
            font-weight: 600;
            color: #7a6590;
            font-size: 1.1em;
        }

        .comment-time {
            font-size: 0.85em;
            color: #a592b3;
            margin-left: auto;
        }

        .comment-content {
            font-size: 1.2em;
            color: #4d3a5c;
            line-height: 1.5;
            padding-left: 50px;
            word-break: break-word;
        }

        .comment-actions {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            padding-left: 50px;
        }

        .comment-action {
            background: none;
            border: none;
            color: #a592b3;
            cursor: pointer;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 3px;
            transition: color 0.2s;
        }

        .comment-action:hover {
            color: #b27a9f;
        }

        /* 空评论提示 */
        .empty-comments {
            text-align: center;
            padding: 50px 20px;
            color: #a592b3;
            font-size: 1.2em;
            font-style: italic;
        }

        /* 底部装饰 */
        .footer-blessing {
            text-align: center;
            margin-top: 30px;
            color: #a592b3;
            font-size: 1.2em;
            text-shadow: 0 2px 5px rgba(255,255,255,0.5);
        }

        /* 提示消息 */
        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            padding: 15px 35px;
            border-radius: 50px;
            color: #7a6590;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 2px solid white;
            z-index: 9999;
            transition: opacity 0.3s;
            opacity: 0;
            pointer-events: none;
        }

        .toast-message.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部装饰 -->
        <div class="card-top-decoration">
            <div class="decoration-circle">✨</div>
            <div class="decoration-circle">💫</div>
            <div class="decoration-circle">⭐</div>
            <div class="decoration-circle">🌙</div>
        </div>

        <!-- 主卡片 -->
        <div class="main-card">
            <div class="title-area">
                <h1 class="glowing-title">祝福时光机</h1>
                <div class="title-tagline">✨ 收集每一份温暖 ✨</div>
            </div>

            <!-- 祝福展示区 -->
            <div class="blessing-showcase">
                <div class="quote-icon left">"</div>
                <div class="quote-icon right">"</div>
                <div id="greetingDisplay">🌈 点击抽取，收获今日份温暖</div>
            </div>

            <!-- 操作区 -->
            <div style="text-align: center;">
                <div class="action-buttons">
                    <button class="primary-btn" onclick="showRandomGreeting()">
                        <span>🎁</span> 抽取祝福 <span>✨</span>
                    </button>
                </div>
                
                <div class="stats-badge">
                    <div class="stat-item">
                        <span>📚</span>
                        <span>祝福库:</span>
                        <span class="stat-number" id="totalCount">30</span>
                    </div>
                    <div class="stat-item">
                        <span>💬</span>
                        <span>留言:</span>
                        <span class="stat-number" id="commentTotalCount">0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 评论区 -->
        <div class="comments-section">
            <div class="section-header">
                <h2>💭 温暖留言板</h2>
                <span class="comment-count" id="commentCount">0 条留言</span>
            </div>

            <!-- 评论输入 -->
            <div class="comment-input-area">
                <div class="comment-input-wrapper">
                    <input type="text" class="comment-input" id="commentInput" 
                           placeholder="写下你的祝福... (例如：愿你今天开心！)" 
                           onkeypress="if(event.key==='Enter') addComment()">
                </div>
                <button class="send-btn" onclick="addComment()">
                    <span>📝</span> 留下祝福
                </button>
            </div>

            <!-- 评论列表 -->
            <div class="comments-list" id="commentsList">
                <!-- 评论会动态加载到这里 -->
                <div class="empty-comments" id="emptyComments">
                    🌸 还没有留言，来做第一个送祝福的人吧～
                </div>
            </div>
        </div>

        <!-- 底部小语 -->
        <div class="footer-blessing">
            ✨ 每一条留言，都是一份温暖的传递 ✨
        </div>
    </div>

    <!-- 提示消息 -->
    <div class="toast-message" id="toastMessage"></div>

    <script>
        // ========== 祝福语库 ==========
        const greetings = [
            "愿你眼中有光，心中有爱，目之所及皆是美好。",
            "生活或许偶尔沉闷，但跑起来就有风。",
            "愿你被这个世界温柔以待。",
            "今天也是被宇宙宠爱的幸运儿！",
            "无论去哪儿，沿途皆是风景。",
            "愿你做一个温柔且有力量的人。",
            "所有的事情都会在最好的时候发生。",
            "你是自己人生的主角，别跑龙套。",
            "愿生活不太拥挤，愿笑容不太刻意。",
            "星光不问赶路人，时光不负有心人。",
            "记得要奔走在自己的热爱里。",
            "愿你遍历山河，觉得人间值得。",
            "把每一天都过得热气腾腾。",
            "你特别好，特别温柔，特别值得。",
            "在这个冬天，和最好的自己碰面。",
            "愿你的快乐如繁星，数也数不清。",
            "别着急，你想要的，岁月都会给你。",
            "保持可爱，烦恼走开。",
            "今天会有好事发生，因为有你在。",
            "你是散落人间的日常，却点亮了某人的星空。",
            "愿你成为自己的太阳，无需凭借谁的光。",
            "把期望降低，把依赖变少，你会过得很好。",
            "慢慢来，谁不是翻山越岭去相爱。",
            "你风尘仆仆走向我，胜过所有遥远的温柔。",
            "要在自己热爱的世界里闪闪发光。"
        ];

        // ========== 评论数据 ==========
        let comments = [];

        // ========== 页面加载时初始化 ==========
        window.addEventListener('load', function() {
            // 更新祝福库总数
            document.getElementById('totalCount').textContent = greetings.length;
            
            // 加载本地保存的评论
            loadComments();
            
            // 显示一条随机祝福
            setTimeout(() => {
                showRandomGreeting();
            }, 500);
        });

        // ========== 随机显示祝福 ==========
        function showRandomGreeting() {
            const randomIndex = Math.floor(Math.random() * greetings.length);
            const selectedGreeting = greetings[randomIndex];
            
            const displayElement = document.getElementById('greetingDisplay');
            
            // 添加动画效果
            displayElement.style.opacity = '0';
            displayElement.style.transform = 'scale(0.9)';
            
            setTimeout(() => {
                displayElement.textContent = selectedGreeting;
                displayElement.style.opacity = '1';
                displayElement.style.transform = 'scale(1)';
                showToast('✨ 祝福已送达 ✨');
            }, 300);
        }

        // ========== 添加评论 ==========
        function addComment() {
            const input = document.getElementById('commentInput');
            const content = input.value.trim();
            
            if (content === '') {
                showToast('💝 写点祝福再发送吧～');
                return;
            }

            // 创建新评论对象
            const newComment = {
                id: Date.now(),  // 用时间戳作为唯一ID
                author: '✨ 祝福使者',
                content: content,
                time: new Date().toLocaleString('zh-CN', { 
                    month: '2-digit', 
                    day: '2-digit', 
                    hour: '2-digit', 
                    minute: '2-digit',
                    hour12: false 
                }),
                likes: 0
            };

            // 添加到数组最前面（最新的在上面）
            comments.unshift(newComment);
            
            // 清空输入框
            input.value = '';
            
            // 重新显示评论列表
            displayComments();
            
            // 保存到本地
            saveComments();
            
            // 更新评论计数
            updateCommentCount();
            
            // 显示成功提示
            showToast('💫 你的祝福已送达留言板');
        }

        // ========== 显示所有评论 ==========
        function displayComments() {
            const commentsList = document.getElementById('commentsList');
            const emptyDiv = document.getElementById('emptyComments');
            
            if (comments.length === 0) {
                // 没有评论时显示空状态
                emptyDiv.style.display = 'block';
                commentsList.innerHTML = '';
                commentsList.appendChild(emptyDiv);
                return;
            }

            // 隐藏空状态
            emptyDiv.style.display = 'none';
            
            // 清空列表
            commentsList.innerHTML = '';
            
            // 遍历所有评论并生成HTML
            comments.forEach(comment => {
                const commentCard = document.createElement('div');
                commentCard.className = 'comment-card';
                commentCard.id = `comment-${comment.id}`;
                
                // 随机头像emoji
                const avatars = ['🌸', '✨', '💫', '⭐', '🌙', '🌈', '🍀', '💝'];
                const randomAvatar = avatars[Math.floor(Math.random() * avatars.length)];
                
                commentCard.innerHTML = `
                    <div class="comment-header">
                        <div class="comment-avatar">${randomAvatar}</div>
                        <span class="comment-author">${comment.author}</span>
                        <span class="comment-time">${comment.time}</span>
                    </div>
                    <div class="comment-content">${comment.content}</div>
                    <div class="comment-actions">
                        <button class="comment-action" onclick="likeComment(${comment.id})">
                            <span>❤️</span> 点赞 <span class="like-count-${comment.id}">${comment.likes}</span>
                        </button>
                        <button class="comment-action" onclick="deleteComment(${comment.id})">
                            <span>🗑️</span> 删除
                        </button>
                    </div>
                `;
                
                commentsList.appendChild(commentCard);
            });
        }

        // ========== 点赞功能 ==========
        function likeComment(commentId) {
            const comment = comments.find(c => c.id === commentId);
            if (comment) {
                comment.likes++;
                // 更新显示
                const likeSpan = document.querySelector(`.like-count-${commentId}`);
                if (likeSpan) {
                    likeSpan.textContent = comment.likes;
                }
                // 保存到本地
                saveComments();
                showToast('❤️ 感谢你的点赞');
            }
        }

        // ========== 删除评论 ==========
        function deleteComment(commentId) {
            if (confirm('确认删除这条祝福留言吗？')) {
                comments = comments.filter(c => c.id !== commentId);
                displayComments();
                updateCommentCount();
                saveComments();
                showToast('🗑️ 留言已删除');
            }
        }

        // ========== 更新评论计数 ==========
        function updateCommentCount() {
            const count = comments.length;
            document.getElementById('commentCount').textContent = count + ' 条留言';
            document.getElementById('commentTotalCount').textContent = count;
        }

        // ========== 保存评论到本地 ==========
        function saveComments() {
            localStorage.setItem('blessingComments', JSON.stringify(comments));
        }

        // ========== 从本地加载评论 ==========
        function loadComments() {
            const saved = localStorage.getItem('blessingComments');
            if (saved) {
                comments = JSON.parse(saved);
                displayComments();
                updateCommentCount();
            }
        }

        // ========== 显示提示消息 ==========
        function showToast(message) {
            const toast = document.getElementById('toastMessage');
            toast.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // ========== 添加示例评论（让页面不空旷） ==========
        function addSampleComments() {
            if (comments.length === 0) {
                const sampleComments = [
                    { author: '🌸 小确幸', content: '愿每个人的每一天都被温柔以待～', time: '12-24 20:30', likes: 5 },
                    { author: '✨ 追光者', content: '这里好温暖，我也来留个祝福！', time: '12-24 20:15', likes: 3 },
                    { author: '⭐ 星空', content: '希望大家都能开开心心的！', time: '12-24 19:50', likes: 2 }
                ];
                
                sampleComments.forEach(c => {
                    comments.push({
                        id: Date.now() - Math.floor(Math.random() * 10000),
                        author: c.author,
                        content: c.content,
                        time: c.time,
                        likes: c.likes
                    });
                });
                
                displayComments();
                updateCommentCount();
                saveComments();
            }
        }

        // 调用示例评论（新用户看到示例）
        setTimeout(addSampleComments, 1000);
    </script>
</body>
</html>
