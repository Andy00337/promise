<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>✨ 祝福时光机 · 匿名留言版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, "Microsoft YaHei", sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f8f0ff, #e9dff5);
            min-height: 100vh;
            padding: 12px;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        /* 主卡片 */
        .main-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 25px 20px;
            box-shadow: 0 10px 30px rgba(124, 92, 156, 0.15);
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.8);
        }

        h1 {
            text-align: center;
            font-size: 2.2em;
            background: linear-gradient(135deg, #9b7ebb, #7c5c9c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #a58bb4;
            font-size: 0.95em;
            margin-bottom: 20px;
            border-bottom: 2px dashed #e9ddf5;
            padding-bottom: 12px;
        }

        /* 祝福展示区 */
        .blessing-box {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 25px;
            padding: 25px 15px;
            margin: 15px 0;
            border: 2px solid white;
            min-height: 130px;
            display: flex;
            align-items: center;
        }

        #greetingDisplay {
            font-size: 1.35em;
            line-height: 1.5;
            color: #4a3b5c;
            text-align: center;
            width: 100%;
            word-break: break-word;
            font-weight: 500;
        }

        /* 按钮 */
        .button-wrapper {
            display: flex;
            justify-content: center;
            margin: 15px 0 10px;
        }

        .btn {
            background: linear-gradient(145deg, #9b7ebb, #7c5c9c);
            color: white;
            border: none;
            width: 80%;
            max-width: 280px;
            padding: 16px 0;
            font-size: 1.25em;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #5d4777;
            font-weight: 600;
            border: 2px solid rgba(255,255,255,0.5);
        }

        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #5d4777;
        }

        /* 统计信息 */
        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 15px 0 5px;
            color: #7a6590;
            font-size: 0.95em;
            background: rgba(255,255,255,0.4);
            padding: 10px 20px;
            border-radius: 40px;
            border: 1px solid white;
        }

        .stats span {
            background: white;
            padding: 3px 12px;
            border-radius: 30px;
            color: #7c5c9c;
            font-weight: bold;
            margin-left: 5px;
        }

        /* 评论区容器 */
        .comments-container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 20px 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.8);
            margin-top: 15px;
        }

        .comments-title {
            font-size: 1.5em;
            color: #7c5c9c;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 3px solid #e9ddf5;
        }

        /* 留言输入框 */
        .comment-input-area {
            margin-bottom: 25px;
        }

        .comment-textarea {
            width: 100%;
            padding: 18px;
            border: 3px solid #f0e6ff;
            border-radius: 25px;
            font-size: 1em;
            outline: none;
            background: white;
            resize: vertical;
            min-height: 100px;
            box-sizing: border-box;
        }

        .comment-textarea:focus {
            border-color: #9b7ebb;
        }

        .send-btn {
            background: linear-gradient(145deg, #9b7ebb, #7c5c9c);
            color: white;
            border: none;
            width: 100%;
            padding: 16px 0;
            border-radius: 30px;
            font-size: 1.2em;
            font-weight: 600;
            margin-top: 10px;
            cursor: pointer;
            box-shadow: 0 3px 0 #5d4777;
            border: 2px solid rgba(255,255,255,0.5);
        }

        .send-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #5d4777;
        }

        .send-btn:disabled {
            opacity: 0.5;
            transform: none;
            box-shadow: 0 3px 0 #5d4777;
            cursor: not-allowed;
        }

        /* 留言列表 */
        .comments-list {
            max-height: 500px;
            overflow-y: auto;
            padding: 5px;
        }

        .comment-item {
            background: rgba(255,255,255,0.7);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 5px solid #9b7ebb;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .comment-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .comment-nick {
            font-weight: 600;
            color: #7c5c9c;
            font-size: 1em;
        }

        .comment-time {
            color: #b4a3c4;
            font-size: 0.8em;
            margin-left: auto;
            white-space: nowrap;
        }

        .comment-content {
            color: #4a3b5c;
            line-height: 1.5;
            font-size: 1.05em;
            word-break: break-word;
            padding-left: 0;
        }

        .empty-msg {
            text-align: center;
            color: #b4a3c4;
            padding: 50px 15px;
            font-size: 1.1em;
        }

        .loading-msg {
            text-align: center;
            color: #b4a3c4;
            padding: 30px;
        }

        .anonymous-tip {
            text-align: center;
            color: #a58bb4;
            font-size: 0.85em;
            margin-top: 15px;
            padding: 8px;
            background: rgba(255,255,255,0.4);
            border-radius: 30px;
        }

        .footer-space {
            height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 主卡片 -->
        <div class="main-card">
            <h1>✨祝福时光机</h1>
            <div class="subtitle">每天一句温暖话</div>
            
            <div class="blessing-box">
                <div id="greetingDisplay">🌈 点下方按钮<br>抽取今日祝福</div>
            </div>
            
            <div class="button-wrapper">
                <button class="btn" onclick="showRandomGreeting()">🎁 抽取祝福</button>
            </div>
            
            <div class="stats">
                <div>祝福库 <span id="totalCount">24</span></div>
                <div>留言 <span id="commentCount">0</span></div>
            </div>
        </div>

        <!-- 评论区 -->
        <div class="comments-container">
            <div class="comments-title">💬 匿名祝福墙</div>
            
            <!-- 输入框 -->
            <div class="comment-input-area">
                <textarea id="commentContent" class="comment-textarea" placeholder="写下你的祝福... (完全匿名，无需任何信息)"></textarea>
                <button id="sendBtn" class="send-btn" onclick="addComment()">💬 匿名发送祝福</button>
            </div>
            
            <!-- 留言列表 -->
            <div id="commentsList" class="comments-list">
                <div class="loading-msg">✨ 加载留言中...</div>
            </div>
            
            <div class="anonymous-tip">
                ✨ 完全匿名 · 昵称随机生成 · 只留祝福不留名
            </div>
        </div>
        <div class="footer-space"></div>
    </div>

    <!-- 祝福语库 -->
    <script>
        const greetings = [
            "愿你每一天都充满阳光和欢笑",
            "祝你身体健康，万事如意",
            "愿幸运和幸福时刻伴随你",
            "新的一天，新的希望，加油",
            "希望你有个超级棒的好心情",
            "愿所有美好，如期而至",
            "今天也是被好运包围的一天",
            "你比想象中更强大，更勇敢",
            "生活明朗，万物可爱",
            "记得要开心，记得要微笑",
            "愿你眼中有光，心中有爱",
            "做自己的太阳，无需凭借谁的光",
            "慢慢来，会好的",
            "今天会有好事发生",
            "你是最棒的",
            "保持可爱，烦恼走开",
            "温柔半两，从容一生",
            "万物皆有裂痕，那是光照进来的地方",
            "愿你遍历山河，觉得人间值得",
            "把每一天都过得热气腾腾",
            "你特别好，特别温柔，特别值得",
            "在这个冬天，和最好的自己碰面",
            "愿你的快乐如繁星，数也数不清",
            "别着急，你想要的，岁月都会给你"
        ];

        document.getElementById('totalCount').innerHTML = greetings.length;

        function showRandomGreeting() {
            let randomIndex = Math.floor(Math.random() * greetings.length);
            document.getElementById('greetingDisplay').innerHTML = greetings[randomIndex];
        }
        
        // 页面加载时显示一条随机祝福
        window.onload = function() {
            showRandomGreeting();
            loadComments(); // 加载留言
        };
    </script>

    <!-- 评论功能脚本 -->
    <script>
        // API地址（改成你的Vercel域名）
        const API_URL = 'https://promise-tau-bay.vercel.app/api/comments';  // 如果部署到Vercel，会自动代理
        // 如果本地测试，用完整地址：
        // const API_URL = 'https://你的项目名.vercel.app/api/comments';

        // 加载所有留言
        async function loadComments() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                
                if (result.success) {
                    displayComments(result.data);
                    document.getElementById('commentCount').innerHTML = result.total;
                } else {
                    showError('加载留言失败');
                }
            } catch (error) {
                console.error('加载留言出错:', error);
                document.getElementById('commentsList').innerHTML = '<div class="empty-msg">❌ 加载失败，请刷新重试</div>';
            }
        }

        // 显示留言列表
        function displayComments(comments) {
            const listDiv = document.getElementById('commentsList');
            
            if (!comments || comments.length === 0) {
                listDiv.innerHTML = '<div class="empty-msg">✨ 还没有留言，来做第一个送祝福的人吧～</div>';
                return;
            }

            let html = '';
            comments.forEach(comment => {
                html += `
                    <div class="comment-item">
                        <div class="comment-header">
                            <span class="comment-nick">${comment.nick}</span>
                            <span class="comment-time">${comment.time}</span>
                        </div>
                        <div class="comment-content">${comment.content}</div>
                    </div>
                `;
            });
            
            listDiv.innerHTML = html;
        }

        // 添加新留言
        async function addComment() {
            const contentInput = document.getElementById('commentContent');
            const content = contentInput.value.trim();
            const sendBtn = document.getElementById('sendBtn');
            
            if (!content) {
                alert('写点祝福再发送吧～');
                return;
            }

            // 禁用按钮防止重复提交
            sendBtn.disabled = true;
            sendBtn.innerHTML = '发送中...';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ content })
                });

                const result = await response.json();
                
                if (result.success) {
                    contentInput.value = ''; // 清空输入框
                    await loadComments(); // 重新加载留言
                    showToast('✨ 祝福已送达');
                } else {
                    alert(result.error || '发送失败，请重试');
                }
            } catch (error) {
                console.error('发送留言出错:', error);
                alert('网络错误，请稍后重试');
            } finally {
                // 恢复按钮
                sendBtn.disabled = false;
                sendBtn.innerHTML = '💬 匿名发送祝福';
            }
        }

        // 显示提示（简单版）
        function showToast(msg) {
            alert(msg); // 简单用alert，也可以改成漂亮的提示
        }

        // 显示错误
        function showError(msg) {
            document.getElementById('commentsList').innerHTML = `<div class="empty-msg">❌ ${msg}</div>`;
        }
    </script>
</body>
</html>
