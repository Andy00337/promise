<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>✨ 祝福时光机 · 匿名留言版</title>
    <!-- Waline CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@waline/client@v3/dist/waline.css" />
    <style>
        /* ========== 手机重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f8f0ff, #e9dff5);
            min-height: 100vh;
            padding: 12px;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        /* ========== 主卡片 ========== */
        .main-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 25px 20px;
            box-shadow: 0 10px 30px rgba(124, 92, 156, 0.15);
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.8);
        }

        h1 {
            text-align: center;
            font-size: 2.2em;
            background: linear-gradient(135deg, #9b7ebb, #7c5c9c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: #a58bb4;
            font-size: 0.95em;
            margin-bottom: 20px;
            border-bottom: 2px dashed #e9ddf5;
            padding-bottom: 12px;
        }

        /* ========== 祝福展示区 ========== */
        .blessing-box {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 25px;
            padding: 25px 15px;
            margin: 15px 0;
            border: 2px solid white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            min-height: 130px;
            display: flex;
            align-items: center;
        }

        #greetingDisplay {
            font-size: 1.35em;
            line-height: 1.5;
            color: #4a3b5c;
            text-align: center;
            width: 100%;
            word-break: break-word;
            font-weight: 500;
            padding: 5px;
        }

        /* ========== 按钮区域 ========== */
        .button-wrapper {
            display: flex;
            justify-content: center;
            margin: 15px 0 10px;
        }

        .btn {
            background: linear-gradient(145deg, #9b7ebb, #7c5c9c);
            color: white;
            border: none;
            width: 80%;
            max-width: 280px;
            padding: 16px 0;
            font-size: 1.25em;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #5d4777, 0 8px 15px rgba(124,92,156,0.3);
            transition: 0.1s;
            font-weight: 600;
            letter-spacing: 2px;
            border: 2px solid rgba(255,255,255,0.5);
        }

        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #5d4777, 0 5px 12px rgba(124,92,156,0.3);
        }

        /* ========== 统计信息 ========== */
        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 15px 0 5px;
            color: #7a6590;
            font-size: 0.95em;
            background: rgba(255,255,255,0.4);
            padding: 10px 20px;
            border-radius: 40px;
            backdrop-filter: blur(5px);
            border: 1px solid white;
        }

        .stats span {
            background: white;
            padding: 3px 12px;
            border-radius: 30px;
            color: #7c5c9c;
            font-weight: bold;
            margin-left: 5px;
        }

        /* ========== Waline评论区容器 ========== */
        .comments-container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 20px 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.8);
            margin-top: 15px;
        }

        .comments-title {
            font-size: 1.5em;
            color: #7c5c9c;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 3px solid #e9ddf5;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .comments-title span {
            background: #e9ddf5;
            padding: 3px 10px;
            border-radius: 30px;
            font-size: 0.7em;
            color: #7c5c9c;
        }

        /* ========== Waline自定义样式 - 匿名版 ========== */
        .waline-container {
            --waline-theme-color: #9b7ebb;
            --waline-active-color: #7c5c9c;
            --waline-color: #4a3b5c;
            --waline-bgcolor: rgba(255,255,255,0.8);
            --waline-bgcolor-light: rgba(255,255,255,0.6);
            --waline-border-color: #e9ddf5;
            --waline-border: 1px solid #e9ddf5;
        }

        /* 隐藏昵称、邮箱、网址输入框 */
        .waline-container .waline-input-wrap,
        .waline-container .waline-email-wrap,
        .waline-container .waline-url-wrap,
        .waline-container .waline-nickname-wrap,
        .waline-container .waline-login-info,
        .waline-container .waline-meta-input {
            display: none !important;
        }

        /* 只显示留言输入框 */
        .waline-container .waline-comment-input {
            margin-bottom: 10px !important;
        }

        .waline-container .waline-content textarea {
            border-radius: 25px !important;
            border: 2px solid #f0e6ff !important;
            padding: 15px 18px !important;
            font-size: 1em !important;
            min-height: 100px !important;
            background: white !important;
            resize: vertical !important;
        }

        .waline-container .waline-content textarea:focus {
            border-color: #9b7ebb !important;
            box-shadow: 0 0 0 3px rgba(155, 126, 187, 0.1) !important;
        }

        /* 按钮样式 */
        .waline-container .waline-submit {
            background: linear-gradient(145deg, #9b7ebb, #7c5c9c) !important;
            border: none !important;
            border-radius: 30px !important;
            padding: 14px 30px !important;
            font-weight: 600 !important;
            color: white !important;
            font-size: 1.1em !important;
            width: 100% !important;
            margin-top: 5px !important;
            box-shadow: 0 3px 0 #5d4777 !important;
            transition: 0.1s !important;
        }

        .waline-container .waline-submit:active {
            transform: translateY(3px) !important;
            box-shadow: 0 1px 0 #5d4777 !important;
        }

        /* 评论卡片 */
        .waline-container .waline-item {
            border-radius: 20px !important;
            border: 1px solid white !important;
            background: rgba(255,255,255,0.7) !important;
            margin-bottom: 15px !important;
            padding: 15px !important;
            position: relative !important;
        }

        /* 随机头像（圆形） */
        .waline-container .waline-avatar {
            border-radius: 50% !important;
            width: 40px !important;
            height: 40px !important;
            background: linear-gradient(145deg, #9b7ebb, #d4b5ff) !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            color: white !important;
            font-size: 1.2em !important;
            margin-right: 12px !important;
        }

        /* 昵称 - 随机生成的 */
        .waline-container .waline-nickname {
            color: #7c5c9c !important;
            font-weight: 600 !important;
            font-size: 1.05em !important;
        }

        /* 时间显示 */
        .waline-container .waline-time {
            color: #b4a3c4 !important;
            font-size: 0.8em !important;
            margin-left: auto !important;
            white-space: nowrap !important;
        }

        /* 评论内容 */
        .waline-container .waline-content {
            color: #4a3b5c !important;
            line-height: 1.5 !important;
            padding: 8px 0 5px 52px !important;  /* 52px留出头像位置 */
            font-size: 1.05em !important;
            word-break: break-word !important;
        }

        /* 删除按钮（只有管理员可见） */
        .waline-container .waline-delete {
            color: #ffb6c1 !important;
            margin-left: 52px !important;
        }

        /* 空状态 */
        .waline-container .waline-comment-content-empty {
            color: #b4a3c4 !important;
            padding: 40px !important;
            text-align: center !important;
            font-size: 1.1em !important;
        }

        /* 页脚提示 */
        .anonymous-tip {
            text-align: center;
            color: #a58bb4;
            font-size: 0.85em;
            margin-top: 10px;
            padding: 8px;
            background: rgba(255,255,255,0.4);
            border-radius: 30px;
        }

        .footer-space {
            height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 主卡片 -->
        <div class="main-card">
            <h1>✨祝福时光机</h1>
            <div class="subtitle">每天一句温暖话</div>
            
            <!-- 祝福展示区 -->
            <div class="blessing-box">
                <div id="greetingDisplay">🌈 点下方按钮<br>抽取今日祝福</div>
            </div>
            
            <!-- 按钮 -->
            <div class="button-wrapper">
                <button class="btn" onclick="showRandomGreeting()">🎁 抽取祝福</button>
            </div>
            
            <!-- 统计信息 -->
            <div class="stats">
                <div>祝福库 <span id="totalCount">24</span></div>
                <div>留言 <span id="commentCount">0</span></div>
            </div>
        </div>

        <!-- Waline评论区（完全匿名版） -->
        <div class="comments-container">
            <div class="comments-title">
                💬 匿名祝福墙
                <span id="waline-count">0</span>
            </div>
            <!-- Waline挂载点 -->
            <div id="waline" class="waline-container"></div>
            <!-- 匿名提示 -->
            <div class="anonymous-tip">
                ✨ 完全匿名 · 昵称头像随机生成 · 只留祝福不留名
            </div>
        </div>
        <div class="footer-space"></div>
    </div>

    <!-- 祝福语库和随机函数 -->
    <script>
        // ========== 祝福语库（24条温暖话） ==========
        const greetings = [
            "愿你每一天都充满阳光和欢笑",
            "祝你身体健康，万事如意",
            "愿幸运和幸福时刻伴随你",
            "新的一天，新的希望，加油",
            "希望你有个超级棒的好心情",
            "愿所有美好，如期而至",
            "今天也是被好运包围的一天",
            "你比想象中更强大，更勇敢",
            "生活明朗，万物可爱",
            "记得要开心，记得要微笑",
            "愿你眼中有光，心中有爱",
            "做自己的太阳，无需凭借谁的光",
            "慢慢来，会好的",
            "今天会有好事发生",
            "你是最棒的",
            "保持可爱，烦恼走开",
            "温柔半两，从容一生",
            "万物皆有裂痕，那是光照进来的地方",
            "愿你遍历山河，觉得人间值得",
            "把每一天都过得热气腾腾",
            "你特别好，特别温柔，特别值得",
            "在这个冬天，和最好的自己碰面",
            "愿你的快乐如繁星，数也数不清",
            "别着急，你想要的，岁月都会给你"
        ];

        // 显示祝福库总数
        document.getElementById('totalCount').innerHTML = greetings.length;

        // ========== 随机显示祝福 ==========
        function showRandomGreeting() {
            let randomIndex = Math.floor(Math.random() * greetings.length);
            let greeting = greetings[randomIndex];
            document.getElementById('greetingDisplay').innerHTML = greeting;
            
            // 小动画
            let box = document.querySelector('.blessing-box');
            box.style.transform = 'scale(0.98)';
            setTimeout(() => {
                box.style.transform = 'scale(1)';
            }, 100);
        }
        
        // 页面加载时显示一条随机祝福
        window.onload = function() {
            showRandomGreeting();
        };
    </script>

    <!-- Waline评论区脚本 - 完全匿名版 -->
    <script type="module">
        import { init } from 'https://unpkg.com/@waline/client@v3/dist/waline.js';
        
        // 随机昵称池（每次生成不同匿名昵称）
        const anonymousNames = [
            '🌸 樱花使者', '✨ 星光旅人', '🍀 幸运草', '🌟 追光者',
            '🌈 彩虹糖', '🦋 蝴蝶结', '🌙 月下客', '⭐ 摘星人',
            '🎋 许愿竹', '🌺 听风者', '☁️ 云朵收藏家', '🌿 薄荷糖',
            '💫 流星划过', '🌼 小雏菊', '🍃 风之语', '🌻 向日葵',
            '🎐 风铃草', '🌊 海浪声声', '⛅ 半糖主义', '🌸 花开半夏'
        ];
        
        // 随机头像颜色池
        const avatarColors = [
            '#9b7ebb', '#b18acf', '#c4a5e0', '#d4b5ff', '#ae8fd0',
            '#b27a9f', '#c49ac9', '#d9b8d4', '#e2caf0', '#bba5d9'
        ];
        
        // 随机emoji池
        const avatarEmojis = ['🌸', '✨', '🍀', '🌟', '🌈', '🦋', '🌙', '⭐', '🎋', '🌺', '☁️', '🌿', '💫', '🌼', '🍃', '🌻', '🎐', '🌊', '⛅', '🎵'];

        // 初始化Waline评论区
        const waline = init({
            el: '#waline',
            // ⚠️ 重要：把这个地址改成你自己部署的Vercel地址！
            serverURL: 'https://promise-hazel.vercel.app',
            
            // 语言设置
            lang: 'zh-CN',
            
            // 评论设置 - 完全匿名
            login: 'disable',           // 禁用登录
            anonymous: true,             // 允许匿名
            requiredMeta: [],            // 不需要任何信息（昵称、邮箱、网址都不要）
            meta: [],                    // 不显示任何输入框
            
            // 每页显示数量
            pageSize: 30,
            
            // 禁用表情
            emoji: false,
            
            // 时间显示格式
            dateFormat: 'YYYY年MM月DD日 HH:mm',
            
            // 自定义头像和昵称的生成函数
            getUserInfo: () => {
                // 随机生成昵称
                const randomName = anonymousNames[Math.floor(Math.random() * anonymousNames.length)];
                // 随机生成头像emoji
                const randomEmoji = avatarEmojis[Math.floor(Math.random() * avatarEmojis.length)];
                // 随机背景色
                const randomColor = avatarColors[Math.floor(Math.random() * avatarColors.length)];
                
                return {
                    displayName: randomName,
                    avatar: `data:image/svg+xml,${encodeURIComponent(`
                        <svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="50" cy="50" r="50" fill="${randomColor}"/>
                            <text x="50" y="70" font-size="50" text-anchor="middle" fill="white" font-family="Arial">${randomEmoji}</text>
                        </svg>
                    `)}`
                };
            },
            
            // 文字自定义
            locale: {
                placeholder: '写下你想说的话... (完全匿名，无需任何信息)',
                submit: '💬 匿名发送祝福',
                reply: '回复',
                cancel: '取消',
                edit: '编辑',
                delete: '删除',
                sure: '确认删除？',
                more: '加载更多...',
                loading: '加载中...',
                admin: '管理员'
            },
            
            // 评论计数回调
            commentCount: function(count) {
                // 更新页面上的留言数
                document.getElementById('commentCount').innerHTML = count;
                document.querySelector('#waline-count').innerHTML = count;
            },
            
            // 评论加载完成后的回调
            after: function() {
                // 隐藏所有登录相关的元素
                setTimeout(() => {
                    document.querySelectorAll('.waline-login-info, .waline-meta-input, .waline-input-wrap').forEach(el => {
                        if (el) el.style.display = 'none';
                    });
                }, 100);
            }
        });
    </script>
</body>
</html>
