<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>✨ 祝福时光机 · 手机版</title>
    <style>
        /* ========== 手机重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;  /* 去掉手机点击灰块 */
            font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f8f0ff, #e9dff5);
            min-height: 100vh;
            padding: 12px;  /* 手机边距小一点 */
        }

        .container {
            max-width: 100%;  /* 手机就是全宽 */
            margin: 0 auto;
        }

        /* ========== 主卡片 ========== */
        .main-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;  /* 手机圆角小一点 */
            padding: 25px 20px;    /* 手机内边距小一点 */
            box-shadow: 0 10px 30px rgba(124, 92, 156, 0.15);
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.8);
        }

        h1 {
            text-align: center;
            font-size: 2.2em;  /* 手机字体小一点 */
            background: linear-gradient(135deg, #9b7ebb, #7c5c9c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: #a58bb4;
            font-size: 0.95em;
            margin-bottom: 20px;
            border-bottom: 2px dashed #e9ddf5;
            padding-bottom: 12px;
        }

        /* ========== 祝福展示区 ========== */
        .blessing-box {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 25px;  /* 手机圆角 */
            padding: 25px 15px;    /* 手机内边距 */
            margin: 15px 0;
            border: 2px solid white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            min-height: 130px;
            display: flex;
            align-items: center;
        }

        #greetingDisplay {
            font-size: 1.35em;  /* 手机字体大小正好 */
            line-height: 1.5;
            color: #4a3b5c;
            text-align: center;
            width: 100%;
            word-break: break-word;
            font-weight: 500;
            padding: 5px;
        }

        /* ========== 按钮区域 ========== */
        .button-wrapper {
            display: flex;
            justify-content: center;
            margin: 15px 0 10px;
        }

        .btn {
            background: linear-gradient(145deg, #9b7ebb, #7c5c9c);
            color: white;
            border: none;
            width: 80%;  /* 手机按钮宽度 */
            max-width: 280px;
            padding: 16px 0;  /* 手机按钮高度 */
            font-size: 1.25em;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #5d4777, 0 8px 15px rgba(124,92,156,0.3);
            transition: 0.1s;
            font-weight: 600;
            letter-spacing: 2px;
            border: 2px solid rgba(255,255,255,0.5);
        }

        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #5d4777, 0 5px 12px rgba(124,92,156,0.3);
        }

        /* ========== 统计信息 ========== */
        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 15px 0 5px;
            color: #7a6590;
            font-size: 0.95em;
            background: rgba(255,255,255,0.4);
            padding: 10px 20px;
            border-radius: 40px;
            backdrop-filter: blur(5px);
            border: 1px solid white;
        }

        .stats span {
            background: white;
            padding: 3px 12px;
            border-radius: 30px;
            color: #7c5c9c;
            font-weight: bold;
            margin-left: 5px;
        }

        /* ========== 评论区 ========== */
        .comments-section {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 20px 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.8);
        }

        .section-title {
            font-size: 1.5em;
            color: #7c5c9c;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 3px solid #e9ddf5;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title span {
            background: #e9ddf5;
            padding: 3px 10px;
            border-radius: 30px;
            font-size: 0.7em;
            color: #7c5c9c;
        }

        /* ========== 输入区域（手机优化）========== */
        .input-area {
            display: flex;
            flex-direction: column;  /* 手机上竖着排 */
            gap: 10px;
            margin-bottom: 20px;
        }

        #commentInput {
            width: 100%;
            padding: 16px 18px;  /* 手机输入框更大，好点击 */
            border: 3px solid #f0e6ff;
            border-radius: 30px;
            font-size: 1em;
            outline: none;
            background: white;
        }

        #commentInput:focus {
            border-color: #9b7ebb;
        }

        .send-btn {
            width: 100%;  /* 手机按钮全宽 */
            background: linear-gradient(145deg, #9b7ebb, #7c5c9c);
            color: white;
            border: none;
            padding: 16px 0;  /* 大按钮好点击 */
            border-radius: 30px;
            font-size: 1.15em;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 3px 0 #5d4777;
            border: 2px solid rgba(255,255,255,0.5);
        }

        .send-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #5d4777;
        }

        /* ========== 评论列表 ========== */
        .comments-list {
            max-height: 450px;
            overflow-y: auto;
            padding: 5px 3px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 单条评论 - 手机卡片 */
        .comment-item {
            background: white;
            border-radius: 20px;
            padding: 15px;
            border-left: 5px solid #9b7ebb;
            box-shadow: 0 3px 10px rgba(0,0,0,0.03);
            width: 100%;
        }

        .comment-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;  /* 手机防止溢出 */
        }

        .avatar {
            width: 32px;
            height: 32px;
            background: #f0e6ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1em;
            flex-shrink: 0;
        }

        .author {
            font-weight: 600;
            color: #7c5c9c;
            font-size: 0.95em;
        }

        .time {
            color: #b4a3c4;
            font-size: 0.8em;
            margin-left: auto;  /* 时间靠右 */
            white-space: nowrap;
        }

        .content {
            font-size: 1.05em;
            color: #333;
            padding: 5px 0 8px 40px;  /* 左边留出头像位置 */
            word-break: break-word;
            line-height: 1.4;
        }

        .delete-btn {
            margin-left: 40px;
            background: none;
            border: none;
            color: #ffb6c1;
            font-size: 0.9em;
            padding: 8px 12px;  /* 手机加大点击区域 */
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            border-radius: 20px;
        }

        .delete-btn:active {
            background: #fff0f3;  /* 点击反馈 */
        }

        /* 空状态 */
        .empty-msg {
            text-align: center;
            color: #b4a3c4;
            padding: 40px 15px;
            font-size: 1.1em;
            background: rgba(255,255,255,0.5);
            border-radius: 20px;
        }

        /* 底部留白 */
        .footer-space {
            height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 主卡片 -->
        <div class="main-card">
            <h1>✨祝福时光机</h1>
            <div class="subtitle">每天一句温暖话</div>
            
            <!-- 祝福展示区 -->
            <div class="blessing-box">
                <div id="greetingDisplay">🌈 点下方按钮<br>抽取今日祝福</div>
            </div>
            
            <!-- 按钮 -->
            <div class="button-wrapper">
                <button class="btn" onclick="showRandomGreeting()">🎁 抽取祝福</button>
            </div>
            
            <!-- 统计 -->
            <div class="stats">
                <div>祝福库 <span id="totalCount">0</span></div>
                <div>留言 <span id="commentCount">0</span></div>
            </div>
        </div>

        <!-- 评论区 -->
        <div class="comments-section">
            <div class="section-title">
                💭 温暖留言板
                <span id="commentCount2">0</span>
            </div>
            
            <!-- 输入框（手机优化：竖排） -->
            <div class="input-area">
                <input type="text" id="commentInput" placeholder="写下你的祝福...">
                <button class="send-btn" onclick="addComment()">📝 发表祝福</button>
            </div>
            
            <!-- 评论列表 -->
            <div class="comments-list" id="commentsList">
                <div class="empty-msg">✨ 还没有留言，<br>来做第一个送祝福的人吧～</div>
            </div>
        </div>
        <div class="footer-space"></div>
    </div>

    <script>
        // ========== 祝福语库 ==========
        const greetings = [
            "愿你每一天都充满阳光和欢笑",
            "祝你身体健康，万事如意",
            "愿幸运和幸福时刻伴随你",
            "新的一天，新的希望，加油",
            "希望你有个超级棒的好心情",
            "愿所有美好，如期而至",
            "今天也是被好运包围的一天",
            "你比想象中更强大，更勇敢",
            "生活明朗，万物可爱",
            "记得要开心，记得要微笑",
            "愿你眼中有光，心中有爱",
            "做自己的太阳，无需凭借谁的光",
            "慢慢来，会好的",
            "今天会有好事发生",
            "你是最棒的",
            "保持可爱，烦恼走开",
            "温柔半两，从容一生",
            "万物皆有裂痕，那是光照进来的地方"
        ];

        // ========== 评论数组 ==========
        let comments = [];

        // ========== 页面初始化 ==========
        window.onload = function() {
            // 显示祝福库数量
            document.getElementById('totalCount').innerHTML = greetings.length;
            
            // 从本地存储加载评论
            loadComments();
            
            // 显示一条随机祝福
            showRandomGreeting();
        };

        // ========== 随机显示祝福 ==========
        function showRandomGreeting() {
            let randomIndex = Math.floor(Math.random() * greetings.length);
            let greeting = greetings[randomIndex];
            document.getElementById('greetingDisplay').innerHTML = greeting;
        }

        // ========== 添加评论 ==========
        function addComment() {
            let input = document.getElementById('commentInput');
            let content = input.value.trim();
            
            // 检查是否为空
            if (content === '') {
                alert('💝 写点祝福再发送吧～');
                return;
            }

            // 获取当前时间
            let now = new Date();
            let month = now.getMonth() + 1;
            let day = now.getDate();
            let hours = now.getHours();
            let minutes = now.getMinutes() < 10 ? '0' + now.getMinutes() : now.getMinutes();
            let timeStr = month + '-' + day + ' ' + hours + ':' + minutes;

            // 创建评论对象
            let newComment = {
                id: Date.now(),
                author: '✨ 祝福使者',
                content: content,
                time: timeStr
            };

            // 添加到数组最前面
            comments.unshift(newComment);

            // 清空输入框
            input.value = '';

            // 重新显示评论列表
            displayComments();

            // 保存到本地存储
            saveComments();

            // 更新计数
            updateCommentCount();
        }

        // ========== 显示所有评论 ==========
        function displayComments() {
            let listDiv = document.getElementById('commentsList');
            
            // 如果没有评论，显示空状态
            if (comments.length === 0) {
                listDiv.innerHTML = '<div class="empty-msg">✨ 还没有留言，<br>来做第一个送祝福的人吧～</div>';
                return;
            }

            // 生成所有评论的HTML
            let html = '';
            for (let i = 0; i < comments.length; i++) {
                let c = comments[i];
                // 随机头像（让每个评论有点不一样）
                let avatars = ['🌸', '✨', '💫', '⭐', '🌙', '🍀', '💝', '🌈'];
                let avatar = avatars[i % avatars.length];
                
                html += `
                    <div class="comment-item" id="comment-${c.id}">
                        <div class="comment-header">
                            <div class="avatar">${avatar}</div>
                            <span class="author">${c.author}</span>
                            <span class="time">${c.time}</span>
                        </div>
                        <div class="content">${c.content}</div>
                        <button class="delete-btn" onclick="deleteComment(${c.id})">🗑️ 删除</button>
                    </div>
                `;
            }
            
            listDiv.innerHTML = html;
        }

        // ========== 删除评论 ==========
        function deleteComment(id) {
            if (confirm('删除这条留言？')) {
                comments = comments.filter(function(c) {
                    return c.id !== id;
                });
                displayComments();
                saveComments();
                updateCommentCount();
            }
        }

        // ========== 更新评论数量 ==========
        function updateCommentCount() {
            let count = comments.length;
            document.getElementById('commentCount').innerHTML = count;
            document.getElementById('commentCount2').innerHTML = count;
        }

        // ========== 保存到本地存储 ==========
        function saveComments() {
            localStorage.setItem('mobileComments', JSON.stringify(comments));
        }

        // ========== 从本地存储加载 ==========
        function loadComments() {
            let saved = localStorage.getItem('mobileComments');
            if (saved) {
                comments = JSON.parse(saved);
                displayComments();
                updateCommentCount();
            }
        }
    </script>
</body>
</html>
